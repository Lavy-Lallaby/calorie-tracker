<!-- ==========================================================================
     finance.html — โมดูลบันทึกรายรับ-รายจ่าย, งบประมาณ & สรุปรายเดือน
     ========================================================================== -->
<div class="space-y-3">

  <!-- 1. การ์ดสรุปยอดรายเดือน & เพดานงบรายวัน -->
  <section class="bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/30 rounded-3xl p-4 border border-emerald-500/30 shadow-lg space-y-3">
    <div class="flex items-start justify-between gap-2">
      <div>
        <span class="text-[11px] text-slate-400 block">ยอดคงเหลือสุทธิเดือนนี้</span>
        <div id="fin-month-balance" class="text-2xl font-extrabold text-white tracking-tight mt-0.5">
          0 <span class="text-xs font-normal text-slate-400">บาท</span>
        </div>
      </div>

      <button type="button" onclick="editDailyExpenseBudget()" class="text-[11px] bg-slate-950/90 hover:bg-slate-800 border border-slate-700 text-amber-300 px-2.5 py-1.5 rounded-xl font-semibold transition">
        งบ/วัน: <span id="fin-daily-budget-label">500</span> บ. <i class="fa-solid fa-pen text-[9px] ml-0.5"></i>
      </button>
    </div>

    <!-- 3 ช่องสรุป: รายจ่ายวันนี้ / รายจ่ายทั้งเดือน / รายรับทั้งเดือน -->
    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="bg-slate-950/80 p-2 rounded-2xl border border-slate-800">
        <span class="text-[10px] text-slate-400 block">จ่ายวันนี้</span>
        <b id="fin-today-expense" class="text-rose-400 text-sm">0 บ.</b>
      </div>
      <div class="bg-slate-950/80 p-2 rounded-2xl border border-slate-800">
        <span class="text-[10px] text-slate-400 block">จ่ายทั้งเดือน</span>
        <b id="fin-month-expense" class="text-amber-300 text-sm">0 บ.</b>
      </div>
      <div class="bg-slate-950/80 p-2 rounded-2xl border border-slate-800">
        <span class="text-[10px] text-slate-400 block">รายรับเดือนนี้</span>
        <b id="fin-month-income" class="text-emerald-400 text-sm">0 บ.</b>
      </div>
    </div>

    <!-- หลอดงบประมาณรายวัน -->
    <div class="space-y-1">
      <div class="flex justify-between text-[10px]">
        <span class="text-slate-400">ใช้งบวันนี้ไปแล้ว <b id="fin-daily-pct" class="text-white">0%</b></span>
        <span id="fin-daily-rem-label" class="text-emerald-400 font-semibold">เหลือ 500 บ.</span>
      </div>
      <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
        <div id="fin-daily-progress" class="bg-emerald-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>
  </section>

  <!-- 2. ฟอร์มบันทึกรายการด่วน + ปุ่มลัด 1 คลิกที่ตั้งค่าเองได้ -->
  <section class="bg-slate-900 rounded-3xl p-4 border border-slate-800 shadow-lg space-y-3">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
        <i class="fa-solid fa-plus-circle text-emerald-400"></i> บันทึกรายรับ / รายจ่ายวันนี้
      </h3>
      <div class="flex bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-[11px]">
        <button type="button" id="fin-type-expense" onclick="setFinanceEntryType('expense')" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-bold">รายจ่าย (-)</button>
        <button type="button" id="fin-type-income" onclick="setFinanceEntryType('income')" class="px-2.5 py-1 rounded-lg text-slate-400">รายรับ (+)</button>
      </div>
    </div>

    <!-- แถบปุ่มบันทึกไว 1 คลิก (ดึงจากรายการประจำ + เพิ่ม/ลบปุ่มลัดได้) -->
    <div class="space-y-1.5">
      <div class="flex items-center justify-between text-[10px] text-slate-400">
        <span><i class="fa-solid fa-bolt text-amber-400 mr-1"></i>เมนูลัดซื้อประจำ (แตะ 1 ครั้งเพื่อบันทึกทันที)</span>
        <button type="button" onclick="toggleFinPresetEditMode()" id="fin-preset-edit-btn" class="text-sky-400 hover:underline font-semibold">
          <i class="fa-solid fa-sliders mr-0.5"></i> จัดการปุ่ม
        </button>
      </div>
      <div id="fin-quick-presets-bar" class="v59-dark-scroll flex gap-1.5 overflow-x-auto pb-1"></div>
    </div>

    <!-- ฟอร์มกรอก + ระบบเดาคำอัตโนมัติจากประวัติ -->
    <form onsubmit="handleFinanceSubmit(event)" class="space-y-2 text-xs relative">
      <div class="grid grid-cols-12 gap-2">
        <select id="fin-category" class="col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-white">
          <option value="food">🍱 อาหาร & เครื่องดื่ม</option>
          <option value="transport">⛽ เดินทาง & น้ำมัน</option>
          <option value="skincare">✨ สกินแคร์ & ของใช้</option>
          <option value="fitness">🏋️ ฟิตเนส & อาหารเสริม</option>
          <option value="trip">🏖️ เที่ยว & ช้อปปิ้ง</option>
          <option value="income">💵 เงินเดือน / รายรับ</option>
          <option value="other">📦 อื่นๆ</option>
        </select>
        <div class="col-span-7 relative">
          <input type="text" id="fin-title" required autocomplete="off"
            oninput="onFinanceTitleInput(this.value)"
            onfocus="onFinanceTitleInput(this.value)"
            placeholder="พิมพ์ชื่อ (เช่น อกไก่) จะดึงราคาเดิมให้"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
          <!-- กล่องแนะนำรายการที่เคยซื้อ -->
          <div id="fin-autocomplete-list" class="hidden absolute left-0 right-0 top-full mt-1 z-30 bg-slate-950 border border-slate-700 rounded-2xl shadow-2xl max-h-44 overflow-y-auto divide-y divide-slate-800/80"></div>
        </div>
      </div>

      <div class="flex gap-2">
        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 flex items-center">
          <input type="number" step="any" id="fin-amount" required placeholder="จำนวนเงิน (บาท)"
            class="w-full bg-transparent text-white font-bold text-sm focus:outline-none" />
          <span class="text-slate-400 ml-1">บาท</span>
        </div>
        <button type="button" onclick="saveCurrentFormAsPreset()" title="บันทึกเป็นปุ่มเมนูลัด" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 font-semibold px-3 rounded-xl shrink-0">
          <i class="fa-solid fa-star"></i>
        </button>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 rounded-xl shrink-0">
          บันทึก
        </button>
      </div>
    </form>
  </section>

  <!-- 3. รายการเงินเข้า-ออกของวันนี้ -->
  <section class="bg-slate-900 rounded-3xl p-4 border border-slate-800 shadow-lg space-y-2.5">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
        <i class="fa-solid fa-receipt text-sky-400"></i> รายการบัญชีวันนี้
      </h3>
      <span id="fin-today-count" class="text-[10px] text-slate-400">0 รายการ</span>
    </div>
    <div id="fin-today-list" class="space-y-1.5"></div>
  </section>

  <!-- 4. สรุปสัดส่วนรายจ่ายแยกตามหมวดหมู่ (ทั้งเดือน) -->
  <section class="bg-slate-900 rounded-3xl p-4 border border-slate-800 shadow-lg space-y-2.5">
    <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
      <i class="fa-solid fa-chart-bar text-amber-400"></i> สัดส่วนรายจ่ายประจำเดือน
    </h3>
    <div id="fin-month-breakdown" class="space-y-2"></div>
  </section>

</div>

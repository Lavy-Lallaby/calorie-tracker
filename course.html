<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTracker - คอร์สเวท & จัดท่าเอง</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="animal.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center pb-16">
    <header class="w-full max-w-md px-4 py-3 flex justify-between items-center bg-slate-900/90 sticky top-0 z-30 border-b border-slate-800">
        <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 inline-flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> <span>กลับหน้าหลัก</span>
        </a>
        <span class="text-xs font-bold text-white">คอร์สเวท & จัดท่าเอง</span>
        <span class="w-16"></span>
    </header>

    <main id="course-page-container" class="w-full max-w-md px-4 pt-4 space-y-3.5">
        <!-- ดึงคอนเทนต์จากชุดตัวแปรและฟังก์ชันใน script.js เดิม -->
        <div id="equipment-checkbox-group" class="hidden">
            <input type="checkbox" id="eq-chair" checked>
            <input type="checkbox" id="eq-band">
            <input type="checkbox" id="eq-dumbbell">
        </div>
        <select id="course-schedule-select" class="hidden">
            <option value="3days">3days</option>
            <option value="4days">4days</option>
            <option value="5days">5days</option>
        </select>

        <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
            <button type="button" id="course-tab-today" onclick="switchCourseTab('today')" class="py-1.5 rounded-lg text-[11px] font-semibold bg-indigo-600 text-white">ตารางฝึกวันนี้</button>
            <button type="button" id="course-tab-custom" onclick="switchCourseTab('custom')" class="py-1.5 rounded-lg text-[11px] font-semibold text-slate-400 hover:text-white">🎯 เลือกท่าเอง & หุ่น</button>
            <button type="button" id="course-tab-library" onclick="switchCourseTab('library')" class="py-1.5 rounded-lg text-[11px] font-semibold text-slate-400 hover:text-white">คลังท่าทั้งหมด</button>
        </div>

        <div id="course-content-container" class="space-y-3"></div>
    </main>

    <script src="script.js?v=55"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof currentCourseTab !== 'undefined') {
                currentCourseTab = 'custom';
                renderWorkoutCourseContent();
            }
        });
    </script>
</body>
</html>

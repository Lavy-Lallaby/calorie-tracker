<!-- ==========================================================================
     addons.html — โมดูลตัวช่วยอัจฉริยะ (Outdoor Mode, Dinner Tetris, ตู้เย็น & เทียบโปรตีน)
     ========================================================================== -->
<div class="space-y-3">

  <!-- 1. โหมดทริปปีนเขา & เที่ยวทะเล (Outdoor & Trip Mode) -->
  <section id="addon-outdoor-card" class="bg-gradient-to-br from-slate-900 via-slate-900 to-teal-950/40 rounded-3xl p-4 border border-teal-500/30 shadow-lg space-y-3"></section>

  <!-- 2. จำลองมื้อเย็นอัตโนมัติ (Smart Dinner Tetris) -->
  <section id="addon-tetris-card" class="bg-slate-900 rounded-3xl p-4 border border-indigo-500/30 shadow-lg space-y-3"></section>

  <!-- 3. ตู้เย็น & คลังเสบียงส่วนตัว (ตัดสต็อกอัตโนมัติเมื่อบันทึกอาหาร) -->
  <section id="addon-pantry-card" class="bg-slate-900 rounded-3xl p-4 border border-sky-500/30 shadow-lg space-y-3"></section>

  <!-- 4. เครื่องคำนวณเทียบความคุ้มค่าโปรตีน (Protein Value Scanner) -->
  <section class="bg-slate-900 rounded-3xl p-4 border border-amber-500/30 shadow-lg space-y-3">
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
          <i class="fa-solid fa-tags text-amber-400"></i> เทียบความคุ้มค่าโปรตีน (7-Eleven / ซูเปอร์)
        </h3>
        <span class="text-[10px] text-slate-400">คำนวณราคาต่อโปรตีน 1 กรัม & ความคลีนของแคลอรี</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
      <div class="col-span-2">
        <input type="text" id="pvs-name" placeholder="ชื่อสินค้า (เช่น อกไก่นุ่ม, นมโปรตีน, ไข่ต้ม)"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500" />
      </div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5">
        <span class="text-[9px] text-amber-300 block">ราคาขาย (บาท)</span>
        <input type="number" step="any" id="pvs-price" oninput="calcProteinValue()" placeholder="เช่น 40"
          class="w-full bg-transparent text-white font-bold mt-0.5 focus:outline-none" />
      </div>
      <div class="bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5">
        <span class="text-[9px] text-emerald-300 block">โปรตีนรวมทั้งซอง (g)</span>
        <input type="number" step="any" id="pvs-prot" oninput="calcProteinValue()" placeholder="เช่น 23"
          class="w-full bg-transparent text-white font-bold mt-0.5 focus:outline-none" />
      </div>
      <div class="col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 flex items-center justify-between">
        <span class="text-[10px] text-slate-400">พลังงานรวมทั้งซอง (kcal) — ไม่บังคับ:</span>
        <input type="number" step="any" id="pvs-cal" oninput="calcProteinValue()" placeholder="130"
          class="w-24 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-right text-white font-bold focus:outline-none" />
      </div>
    </div>

    <div id="pvs-result-box" class="bg-slate-950/90 border border-slate-800 rounded-2xl p-3 text-xs text-slate-400 text-center">
      กรอกราคาและปริมาณโปรตีนเพื่อคำนวณความคุ้มค่าทันที
    </div>

    <div id="pvs-saved-list" class="space-y-1.5"></div>
  </section>

</div>

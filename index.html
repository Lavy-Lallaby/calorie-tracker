<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTracker — หน้าหลัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-5">
    <div class="max-w-md mx-auto space-y-4">
        <!-- กล่องก้าวเดิน & การออกกำลังกาย -->
        <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
                    <h1 class="text-sm font-bold text-white">ก้าวเดิน &amp; การออกกำลังกาย</h1>
                </div>
                <span id="totalBurnedBadge" class="text-xs font-bold text-orange-400">0 kcal</span>
            </div>

            <!-- จำนวนก้าว -->
            <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-3 space-y-2">
                <div class="flex items-center justify-between text-xs">
                    <span class="text-slate-300 font-medium"><i class="fa-solid fa-shoe-prints text-amber-400 mr-1.5"></i>จำนวนก้าววันนี้</span>
                    <span id="stepKcalText" class="text-slate-400">เผาผลาญ 0 kcal</span>
                </div>
                <div class="flex items-center gap-2">
                    <input id="stepCountInput" type="number" min="0" value="1500"
                        onchange="updateSteps(this.value)"
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm font-semibold text-white focus:outline-none focus:border-indigo-500" />
                    <button type="button" onclick="addSteps(1000)"
                        class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white px-3 py-2 rounded-xl transition">
                        +1,000
                    </button>
                </div>
                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                    <div id="stepProgressBar" class="h-full bg-orange-500 transition-all" style="width: 15%"></div>
                </div>
                <div class="flex items-center justify-between text-[11px] text-slate-400">
                    <span>เป้าหมาย 10,000 ก้าว</span>
                    <span id="stepPercentText">15%</span>
                </div>
            </div>

            <!-- รายการออกกำลังกายที่บันทึกไว้ (กดดูรายชื่อท่าครบ / วิธีทำ / แก้ไขได้) -->
            <div id="dashboardWorkoutLogs" class="divide-y divide-slate-800/80"></div>

            <!-- ปุ่มนำทางไปหน้าคอร์สเวท -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <a href="course.html"
                    class="bg-indigo-950/70 hover:bg-indigo-900/70 border border-indigo-500/40 text-indigo-200 text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-dumbbell"></i>
                    <span>คอร์สเวท &amp; ตารางฝึก</span>
                </a>
                <button type="button" onclick="openQuickCustomExerciseModal()"
                    class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>บันทึกกิจกรรมเอง</span>
                </button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderDashboard();
        });
    </script>
</body>
</html>

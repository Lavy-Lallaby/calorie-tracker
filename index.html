<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker - บันทึกและควบคุมพลังงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <h1 class="logo-title">FitTracker</h1>
                <span class="calorie-badge">1,500 kcal</span>
            </div>
            <div class="header-icons">
                <button class="icon-btn" id="resetDayBtn" title="รีเซ็ตวัน">🔄</button>
                <button class="icon-btn" title="ตั้งค่า">⚙️</button>
            </div>
        </header>

        <div class="date-display">วันพฤหัสบดีที่ 12 พฤศจิกายน 2569</div>

        <!-- Summary Card -->
        <div class="summary-card">
            <div class="summary-top">
                <div>
                    <div class="summary-label">พลังงานคงเหลือ</div>
                    <div class="summary-value" id="remainingCalories">1,500 <span>kcal</span></div>
                </div>
                <div>
                    <div class="summary-label" style="text-align: right;">โปรตีนวันนี้</div>
                    <div class="protein-value" id="totalProtein">0.0 <span>/ 96–128 g</span></div>
                </div>
            </div>

            <div class="nutrients-grid">
                <div>คาร์บ<strong id="totalCarbs">0.0g</strong></div>
                <div>ไขมัน<strong id="totalFat">0.0g</strong></div>
                <div>โซเดียม<strong id="totalSodium">0mg</strong></div>
                <div>คอเลสเตอรอล<strong id="totalCholesterol">0mg</strong></div>
            </div>

            <div class="progress-info">
                <span id="consumedText">ทานไป 0 kcal</span>
                <span class="status-badge" id="statusBadge">กำลังคุม</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Meal Sections Container -->
        <div id="mealSectionsContainer">
            <!-- เรนเดอร์ด้วย JavaScript -->
        </div>

        <!-- Big Bottom Add Button (ตามกรอบสีแดงในภาพ) -->
        <button class="big-add-btn" onclick="openAddModal('breakfast')">
            <span>+</span> เพิ่มรายการอาหาร
        </button>
    </div>

    <!-- Modal ฟอร์มเพิ่ม/แก้ไขรายการอาหาร -->
    <div id="foodModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top: 0; font-size: 18px; margin-bottom: 16px;">บันทึกมื้ออาหาร</h3>
            <form id="foodForm">
                <input type="hidden" id="editMealType">
                <input type="hidden" id="editItemIndex" value="">

                <div class="form-group">
                    <label>มื้ออาหาร</label>
                    <select id="mealSelectDropdown" class="form-control">
                        <option value="breakfast">มื้อเช้า</option>
                        <option value="lunch">มื้อเที่ยง</option>
                        <option value="dinner">มื้อเย็น</option>
                        <option value="snack">ของว่าง / อื่นๆ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ชื่ออาหาร</label>
                    <input type="text" id="foodNameInput" list="food-list" class="form-control" required placeholder="พิมพ์หรือเลือกชื่ออาหาร เช่น หมูย่าง...">
                    <datalist id="food-list"></datalist>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>แคลอรี (kcal)</label>
                        <input type="number" id="caloriesInput" class="form-control" required min="0">
                    </div>
                    <div class="form-group">
                        <label>โปรตีน (g)</label>
                        <input type="number" id="proteinInput" class="form-control" step="0.1" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>คาร์โบไฮเดรต (g)</label>
                        <input type="number" id="carbsInput" class="form-control" step="0.1" min="0">
                    </div>
                    <div class="form-group">
                        <label>ไขมัน (g)</label>
                        <input type="number" id="fatInput" class="form-control" step="0.1" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>โซเดียม (mg)</label>
                        <input type="number" id="sodiumInput" class="form-control" min="0">
                    </div>
                    <div class="form-group">
                        <label>คอเลสเตอรอล (mg)</label>
                        <input type="number" id="cholesterolInput" class="form-control" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>จำนวนหน่วย (Qty)</label>
                    <input type="number" id="qtyInput" class="form-control" value="1" min="1" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="closeModalBtn">ยกเลิก</button>
                    <button type="submit" class="btn-submit">บันทึกรายการ</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-white pb-24">

  <!-- Header วันที่ & ซิงก์ GitHub -->
  <header id="app-header" class="sticky top-0 z-30 bg-slate-900/95 border-b border-slate-800 p-3">
    <!-- ... แถบวันที่และปุ่มตั้งค่า ... -->
  </header>

  <!-- พื้นที่โหลดไฟล์ HTML ย่อย (foodtrack.html / train.html / skincare.html / summary.html / trip.html) -->
  <main id="page-slot" class="max-w-lg mx-auto p-3"></main>

  <!-- แถบเมนู 5 ปุ่มด้านล่าง -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-slate-900 border-t border-slate-800 grid grid-cols-5 p-1.5">
    <button onclick="loadPageModule('foodtrack')" id="nav-foodtrack" class="nav-btn">🍱 อาหาร</button>
    <button onclick="loadPageModule('train')" id="nav-train" class="nav-btn">🏋️ เวท</button>
    <button onclick="loadPageModule('skincare')" id="nav-skincare" class="nav-btn">✨ ผิว</button>
    <button onclick="loadPageModule('summary')" id="nav-summary" class="nav-btn">📊 สรุป</button>
    <button onclick="loadPageModule('trip')" id="nav-trip" class="nav-btn">🗺️ เที่ยว</button>
  </nav>

  <!-- โหลดระบบกลางและโมดูล JS ทั้งหมด -->
  <script src="core.js"></script>
  <script src="foodtrack.js"></script>
  <script src="train.js"></script>
  <script src="skincare.js"></script>
  <script src="summary.js"></script>
  <script src="trip.js"></script>
</body>
</html>
